name: Docker Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker build -t honkai-star-rail-randomizer:latest .
        docker images
    
    - name: Test Docker container
      run: |
        # Run container in background
        docker run -d --name test-container -p 8080:80 honkai-star-rail-randomizer:latest
        
        # Wait for container to be ready
        sleep 5
        
        # Test if container is running
        docker ps | grep test-container
        
        # Test if application is accessible
        curl -f http://localhost:8080 || exit 1
        
        # Show container logs
        docker logs test-container
        
        # Stop and remove container
        docker stop test-container
        docker rm test-container
    
    - name: Login to Docker Hub (optional - only on push to main)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      continue-on-error: true
    
    - name: Push to Docker Hub (optional)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag honkai-star-rail-randomizer:latest ${{ secrets.DOCKER_USERNAME }}/honkai-star-rail-randomizer:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/honkai-star-rail-randomizer:latest
      continue-on-error: true
    
    - name: Build summary
      run: |
        echo "## Docker Build Summary 🐳" >> $GITHUB_STEP_SUMMARY
        echo "✅ Docker image built successfully" >> $GITHUB_STEP_SUMMARY
        echo "✅ Container tested and working" >> $GITHUB_STEP_SUMMARY
        echo "✅ Application accessible on port 80" >> $GITHUB_STEP_SUMMARY

